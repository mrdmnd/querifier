[package]
name = "querifier"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlparser = "0.62.0"
z3 = { version = "0.20.2", features = ["vendored"] }

[dev-dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
