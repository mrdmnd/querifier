[package]
name = "querifier"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlparser = "0.62.0"
z3 = { version = "0.20.2", features = ["vendored"] }

[dev-dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bench]]
name = "leetcode_long_tail"
harness = false

[[bench]]
name = "leetcode_representative"
harness = false

[[bench]]
name = "identity_fast_path"
harness = false

[[bench]]
name = "bound_orchestration"
harness = false

[[bench]]
name = "prepared_session"
harness = false
